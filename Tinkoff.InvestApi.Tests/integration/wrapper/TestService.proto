syntax = "proto3";

option csharp_namespace = "Tinkoff.InvestApi.Tests.Integration.Wrapper";

package testwrapper;

service TestStreamService {
  rpc Subscribe (SubscribeRequest) returns (stream StreamMessage);
  rpc DuplexStream (stream SubscribeRequest) returns (stream StreamMessage);
}

message SubscribeRequest {
  string subscription_id = 1;
}

message StreamMessage {
  string message_id = 1;
  int64 timestamp = 2;
  string payload = 3;
}
